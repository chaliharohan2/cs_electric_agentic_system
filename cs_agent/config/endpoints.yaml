endpoints:
  sonnet:
    base_url: https://api.anthropic.com/v1/
    model: claude-sonnet-5
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 20000

  qwen_a3b:
    base_url: http://10.0.0.11:8000/v1
    model: Qwen/Qwen3.6-35B-A3B
    api_key_env: LOCAL_LLM_API_KEY
    temperature: 0.0
    max_tokens: 4096
    extra_body:
      chat_template_kwargs: {enable_thinking: false}

  qwen_27b:
    base_url: http://10.0.0.12:8000/v1
    model: Qwen/Qwen3.6-27B
    api_key_env: LOCAL_LLM_API_KEY
    temperature: 0.6
    max_tokens: 8192
    extra_body:
      chat_template_kwargs: {enable_thinking: true}

  # Native Ollama endpoints. `provider: ollama` swaps ChatOpenAI for ChatOllama,
  # which needs no API key and takes thinking and the context window directly.
  ollama_27b:
    provider: ollama
    base_url: http://192.168.0.147:11434/api/chat
    model: qwen3.6:27b
    temperature: 0.0
    max_tokens: 20000
    thinking: false
    # keep_alive: -1 # to keep the model loaded forever
    num_ctx: 80000
    timeout: 1800.0

  ollama_35b:
    provider: ollama
    base_url: http://192.168.0.147:11434/api/chat
    model: qwen3.6:35b
    temperature: 0.0
    max_tokens: 20000
    thinking: false
    keep_alive: -1 # to keep the model loaded forever
    num_ctx: 80000
    timeout: 1800.0

# ---- switching models = editing this block only ----
nodes:
  intake:    sonnet
  planner:   sonnet
  clarify:   sonnet
  agent:     sonnet
  composer:  sonnet
  analytics.write_sql: sonnet
  analytics.shape:     sonnet
