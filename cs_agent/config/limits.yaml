global_tool_budget: 100
per_agent_tool_budget: 20
# An overview answers at range level: a walk down the taxonomy and little else.
# Kept tight because a specialist treats spare budget as work still to do, but
# not tighter than the deepest walk — root plus four levels is four browses, and
# a malformed call that fails validation still costs one.
overview_tool_budget: 6
composer_revision_rounds: 2
clarify_rounds: 2
tool_failure_limit: 3
max_parallel_agents: 5
max_stages: 3
analytics_max_queries: 4

# Tool-result caps: keep one call from filling the model's context window.
max_peer_rows: 25
max_chunk_chars: 1500
max_facet_rows: 60
analytics_registry_chars: 24000
sqlite_path: artifacts/catalog-latest.sqlite
checkpoint_path: state/checkpoints.sqlite
sqlite_pragmas:
  journal_mode: WAL
  query_only: 1
  mmap_size: 268435456
  cache_size: -64000
  temp_store: MEMORY
